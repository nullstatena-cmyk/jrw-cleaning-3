name = "jw-cleaning-intake"
main = "src/index.js"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"
database_name = "jw-cleaning-2"
database_id = "e3caf26d-aed9-4019-a74f-0a301e7f054a"

[triggers]
crons = ["*/5 * * * *"]   # retry stranded submissions every 5 minutes

[vars]
# The Cloudflare Tunnel hostname for the home box. Leave EMPTY until that
# machine actually exists — an unreachable value makes every submission wait
# out a 5 second timeout before returning. Empty means the Worker skips the
# push entirely and the row just sits 'unsent' until the box pulls it.
HOME_ENDPOINT = ""
# HOME_ENDPOINT = "https://dashboard.jrw-cleaning.com/intake"

# SYNC_TOKEN is a SECRET. Never put it here.
#   wrangler secret put SYNC_TOKEN
